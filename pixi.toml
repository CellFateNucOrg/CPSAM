[workspace]
channels = ["conda-forge"]
name = "cpsam"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
napari = ">=0.8.0,<0.9"
jupyter = ">=1.1.1,<2"
bioio = ">=3.4.0,<4"
matplotlib-scalebar = ">=0.9.0,<0.10"
scipy = ">=1.18.0,<2"
polars = ">=1.43.2,<2"

[pypi-dependencies]
bioio-nd2 = ">=2.3.0, <3"
bioio-ome-tiff = ">=1.4.0, <2"
bioio-tifffile = ">=1.3.0, <2"
cellpose = ">=4.2.1.1, <5"
micro-sam = ">=1.8.6, <2"
segment-anything-py = ">=1.0.1, <2"
btrack = ">=0.7.0, <0.8"
